# PR / main 基础质量门禁：减轻维护者手工验证，仅 Founder 需关注高影响路径 Review
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # docs/ 是独立部署到 Cloudflare Pages 的 VitePress 站，
          # 博客构建一行都不引用它，却占了工作树 200MB 里的 173MB。
          # 这三个 job 不检出它，省掉每次 checkout 的绝大部分下载量。
          sparse-checkout: |
            /*
            !/docs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn type-check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # docs/ 是独立部署到 Cloudflare Pages 的 VitePress 站，
          # 博客构建一行都不引用它，却占了工作树 200MB 里的 173MB。
          # 这三个 job 不检出它，省掉每次 checkout 的绝大部分下载量。
          sparse-checkout: |
            /*
            !/docs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --passWithNoTests

  lockfile:
    name: Lockfile consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # docs/ 是独立部署到 Cloudflare Pages 的 VitePress 站，
          # 博客构建一行都不引用它，却占了工作树 200MB 里的 173MB。
          # 这三个 job 不检出它，省掉每次 checkout 的绝大部分下载量。
          sparse-checkout: |
            /*
            !/docs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn deps:check-lockfile

  docs-site:
    name: VitePress build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn docs:site:build
        env:
          VITE_GISCUS_ENABLED: 'false'
